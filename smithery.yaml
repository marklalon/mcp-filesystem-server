# Smithery configuration file: https://smithery.ai/docs/config#smitheryyaml

startCommand:
  type: stdio
  configSchema:
    # JSON Schema defining the configuration options for the MCP.
    type: object
    required:
      - workspaceDirectory
    properties:
      workspaceDirectory:
        type: string
        description: The absolute path to the single directory the filesystem
          server serves. All tool paths are relative to it. For example, in the
          Docker container '/app' is a good default.
      ignoreDirectories:
        type: array
        items:
          type: string
        description: Optional glob patterns for directory names to deny, such
          as '.*' or '.git'.
  commandFunction:
    # A JS function that produces the CLI command based on the given config to start the MCP on stdio.
    |-
    (config) => ({
      command: './server',
      args: [
        config.workspaceDirectory,
        ...(config.ignoreDirectories || []).flatMap((pattern) => ['--ignore-dir', pattern])
      ]
    })
  exampleConfig:
    workspaceDirectory: /app
